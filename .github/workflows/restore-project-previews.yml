name: restore-project-previews
on:
  push:
    branches: [main]
    paths: ['_restore/**']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p public/projects
          for f in _restore/*.b64; do n=$(basename "$f" .b64); base64 -d "$f" > "public/projects/$n"; done
          git rm -rq _restore .github/workflows/restore-project-previews.yml
          git add public/projects
          git config user.name olishiz
          git config user.email zhuen1101@hotmail.com
          git commit -m "Restore project preview images (one-time workflow, removes itself)"
          git push
